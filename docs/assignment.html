      <h1>完成したプログラムを1か所ずつ変えて、何が起きるかを確かめる</h1>
      <p class="lead">実装ガイドを最後まで進め、完成画面が表示できる状態から始めます。新しい API は使いません。1つの課題で変えるのは1か所だけにして、変える前に「どうなるか」を予想してから起動してください。</p>
      <p class="lead">課題 1〜6 は3世代共通です（期待する画面の写真は DirectX 11 で撮影）。課題 7 は、その世代ならではの仕組みを体験する課題です。1つ終えたら、元に戻してから次へ進みます。</p>

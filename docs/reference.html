<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DirectX 実装ガイド</title>
  <link rel="stylesheet" href="reference.css">
  <script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" data-action="top">
      <span class="brand-mark">DX</span>
      <span class="brand-text"><strong>KCG DirectX Study</strong><small>実装ガイド</small></span>
    </a>
    <nav class="tabs" aria-label="DirectX の世代">
      <button type="button" data-generation="dx9">DirectX 9</button>
      <button type="button" data-generation="dx11">DirectX 11</button>
      <button type="button" data-generation="dx12">DirectX 12</button>
    </nav>
    <div class="topbar-actions">
      <button type="button" class="theme-toggle" data-theme-toggle title="ダーク / ライトを切り替える">☀ ライト</button>
      <button type="button" class="search-button" data-action="search" title="検索（Ctrl + K）">検索 <kbd>Ctrl K</kbd></button>
      <a class="assignment-link" id="assignment-link" href="assignment.html">課題へ</a>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar" aria-label="目次">
      <div id="progress" class="progress"></div>
      <nav id="toc" class="toc"></nav>
    </aside>

    <main id="main">
      <section id="overview" class="overview"></section>
      <div id="chapters"></div>
      <section id="compare" class="compare"></section>
      <section id="dictionary" class="dictionary"></section>
    </main>
  </div>

  <aside id="drawer" class="drawer" hidden aria-label="辞書">
    <div class="drawer-head">
      <span id="drawer-kind" class="drawer-kind"></span>
      <button type="button" class="drawer-close" data-action="close-drawer" aria-label="閉じる">×</button>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <dialog id="search" class="search-dialog">
    <form method="dialog" class="search-form">
      <input id="search-input" type="search" autocomplete="off" placeholder="手順・関数・型・用語を検索（例: SRV, Barrier, CreateBuffer）">
      <button type="submit" class="search-close" aria-label="閉じる">Esc</button>
    </form>
    <ul id="search-results" class="search-results"></ul>
  </dialog>

  <script src="dictionary.js"></script>
  <script src="macros.js"></script>
  <script src="lessons.js"></script>
  <script src="reference-code.js"></script>
  <script src="reference.js"></script>
</body>
</html>
